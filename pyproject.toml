[project]
name = "sae-feature-stability-doe"
version = "0.1.0"
description = "Collect and analyze Gemma Scope SAE feature activations across a prompt x layer factorial design."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "huggingface-hub>=0.24",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "sae-lens>=5.0",
    "seaborn>=0.13",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "torch>=2.3",
    "transformers>=4.44",
]

[project.scripts]
run-collection = "src.collect:main"
run-inspection = "src.inspect:main"
run-analysis = "src.analyze:main"
run-factorial = "src.factorial:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
